<!doctype html>
<meta charset="utf-8">
<title>Yoin splash source — 2732×2732</title>
<style>
  @font-face {
    font-family: 'Noto Serif JP';
    font-style: normal;
    font-weight: 400;
    src: url('../src/assets/noto-serif-jp-subset.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    font-style: normal;
    font-weight: 400;
    src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    font-style: normal;
    font-weight: 600;
    src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2') format('woff2');
  }
  html, body { margin: 0; padding: 0; background: #f5f0e3; }
  .splash {
    width: 2732px; height: 2732px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #f5f0e3;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.014) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.011) 0 1px, transparent 1px 4px),
      radial-gradient(130% 100% at 22% 0%, #fbf7ec, #f4efe1 58%, #eae2ce);
  }
  .splash-mark {
    width: 266px; height: 266px;
    border: 7.2px solid #b0342a; border-radius: 14.4px; color: #b0342a;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Serif JP', serif;
    font-size: 94px; line-height: 1.06; writing-mode: vertical-rl;
    transform: rotate(-3.5deg);
    box-shadow: 0 0 0 14.4px #f5f0e3, 0 0 0 19.8px rgba(176,52,42,.2);
  }
  .splash-word {
    font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
    font-size: 108px; font-weight: 600; letter-spacing: .3em;
    margin: 137px 0 0 .3em; color: #25221e;
  }
  .splash-rule { width: 432px; border-top: 3.6px dashed #cec5b0; margin: 79px 0; }
  .splash-whisper {
    font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
    font-size: 34px; letter-spacing: .32em; color: #8d8578; text-transform: uppercase;
  }
</style>
<div class="splash">
  <span class="splash-mark">余韻</span>
  <span class="splash-word">YOIN</span>
  <span class="splash-rule"></span>
  <span class="splash-whisper">Record · Reflect · Remain</span>
</div>
