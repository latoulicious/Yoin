<!doctype html>
<meta charset="utf-8">
<title>Yoin splash source — 2732×2732</title>
<style>
  @font-face {
    font-family: 'Noto Serif JP';
    font-style: normal;
    font-weight: 400;
    src: url('../src/assets/noto-serif-jp-subset.woff2') format('woff2');
  }
  html, body { margin: 0; padding: 0; background: #f5f0e3; }
  .splash {
    width: 2732px; height: 2732px;
    display: flex; align-items: center; justify-content: center;
    background: #f5f0e3;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.014) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.011) 0 1px, transparent 1px 4px),
      radial-gradient(130% 100% at 22% 0%, #fbf7ec, #f4efe1 58%, #eae2ce);
  }
  .hanko {
    width: 328px; height: 328px;
    border-radius: 34px;
    background: #b0342a;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 8px rgba(255,255,255,.22);
  }
  .hanko span {
    font-family: 'Noto Serif JP', serif;
    font-size: 207px; line-height: 1;
    color: #f7f3e8;
    margin-top: -4px;
  }
</style>
<div class="splash"><span class="hanko"><span>余</span></span></div>
