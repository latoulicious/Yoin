name: android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "capacitor.config.ts"
      - "index.html"
      - "vite.config.ts"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # rolling "latest" release upload
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx cap sync android

      - name: Decode signing keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/yoin-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YOIN_KEYSTORE_BASE64 }}

      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          YOIN_KEYSTORE_PATH: ${{ github.workspace }}/android/yoin-release.keystore
          YOIN_KEYSTORE_PASSWORD: ${{ secrets.YOIN_KEYSTORE_PASSWORD }}

      - name: Publish APK to rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk yoin.apk
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Yoin APK (rolling)" --notes "Always the newest APK built from main." --latest
          gh release upload latest yoin.apk --clobber
          gh release edit latest --prerelease=false --latest --notes "Built from \`${GITHUB_SHA::7}\` on $(date -u +%Y-%m-%d)."

      # Non-main runs (workflow_dispatch on branches) still get an artifact.
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: yoin-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
