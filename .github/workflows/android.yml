name: android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "capacitor.config.ts"
      - "index.html"
      - "vite.config.ts"
      - ".github/workflows/android.yml"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # rolling "latest" release upload
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Native shell only changes when android/, the lockfile (new plugin), or the Capacitor config move.
      # package.json alone is a version bump and ships OTA.
      - name: Detect native change
        id: native
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- android pnpm-lock.yaml capacitor.config.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.native.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Build signed APK
        if: steps.native.outputs.changed == 'true'
        run: |
          npx cap sync android
          echo "$KEYSTORE_BASE64" | base64 -d > android/yoin-release.keystore
          cd android && ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../yoin.apk
        env:
          KEYSTORE_BASE64: ${{ secrets.YOIN_KEYSTORE_BASE64 }}
          YOIN_KEYSTORE_PATH: ${{ github.workspace }}/android/yoin-release.keystore
          YOIN_KEYSTORE_PASSWORD: ${{ secrets.YOIN_KEYSTORE_PASSWORD }}

      - name: Zip web bundle
        run: |
          (cd dist && zip -qr ../bundle.zip .)
          echo "sha256=$(sha256sum bundle.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        id: bundle

      - name: Changelog since previous release
        id: changelog
        run: |
          if git rev-parse -q --verify refs/tags/latest >/dev/null; then
            range="latest..HEAD"
          else
            range="HEAD~10..HEAD"
          fi
          git log --format=%s "$range" | grep -v '^chore' | head -10 | jq -R . | jq -sc . > changelog.json
          echo "json=$(cat changelog.json)" >> "$GITHUB_OUTPUT"

      # Non-main runs stop here with artifacts.
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: yoin-build
          path: |
            bundle.zip
            yoin.apk
          if-no-files-found: ignore

      - name: Move rolling tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Yoin (rolling)" --notes "Always the newest build from main." --latest

      - name: Upload APK
        if: github.ref == 'refs/heads/main' && steps.native.outputs.changed == 'true'
        run: gh release upload latest yoin.apk --clobber

      - name: Upload web bundle
        if: github.ref == 'refs/heads/main'
        run: gh release upload latest bundle.zip --clobber

      # Manifest goes last: everything it points at must already be on the release.
      - name: Write and upload manifest
        if: github.ref == 'refs/heads/main'
        run: |
          version_code=$(sed -n 's/^\s*versionCode \([0-9]*\).*/\1/p' android/app/build.gradle)
          version_name=$(sed -n 's/^\s*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle)
          app_version=$(node -p "require('./package.json').version")
          apk_bytes=$(gh release view latest --json assets -q '.assets[] | select(.name=="yoin.apk") | .size')
          jq -n \
            --arg v "$app_version" --arg c "${GITHUB_SHA::7}" --arg burl "$RELEASE_BASE/bundle.zip" \
            --arg sha "${{ steps.bundle.outputs.sha256 }}" --argjson code "$version_code" \
            --arg vname "$version_name" --arg aurl "$RELEASE_BASE/yoin.apk" --argjson bytes "${apk_bytes:-0}" \
            --argjson log '${{ steps.changelog.outputs.json }}' --arg date "$(date -u +%Y-%m-%d)" \
            '{bundle:{version:$v,commit:$c,url:$burl,sha256:$sha,minNative:$code},apk:{versionCode:$code,versionName:$vname,url:$aurl,bytes:$bytes},changelog:$log,date:$date}' \
            > manifest.json
          cat manifest.json
          gh release upload latest manifest.json --clobber
          gh release edit latest --prerelease=false --latest --notes "Built from \`${GITHUB_SHA::7}\` on $(date -u +%Y-%m-%d)."
